name: ci

# Runs on every PR to main and every push to main. Keeps the tool contract
# stable and runs the complete root suite, including snapshot quality,
# api-worker typechecking, and generated Worker type drift checks.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false # mcp-inspector submodule is dev-only, skip for CI speed

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build and test workspace
        run: pnpm test

      - name: Verify server.json shape
        run: node -e "const m=require('./packages/mcp-server/server.json'); if(m.version!==require('./packages/mcp-server/package.json').version){throw new Error('server.json version does not match package.json')}; console.log('server.json version matches package.json:', m.version)"
