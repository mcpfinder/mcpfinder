name: build-snapshot

# Builds a fresh SQLite snapshot from all three registries and uploads it to
# the R2 bucket mcp-finder-db-snapshots. Clients download this instead of
# running the ~11 min live sync on first start.
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN    — token with R2 edit permission
#   CLOUDFLARE_ACCOUNT_ID   — Cloudflare account ID
#   GLAMA_API_KEY           — https://glama.ai/settings/api-keys. Glama closed
#                             its public API on 2026-08-26. Without the key the
#                             Glama sync is skipped, and since all three
#                             registries are required the quality gate fails and
#                             nothing is published: an incomplete snapshot never
#                             replaces the complete one already being served.

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours at :17
  workflow_dispatch:
    inputs:
      allow_quality_regression:
        description: Allow a >5% count drop for a controlled data reset
        required: false
        type: boolean
        default: false

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Least privilege, with two additions the freeze signal at the end of this
    # job needs: `issues: write` to open/update/close the alarm, and
    # `actions: read` so `gh run view --json jobs` can name the step that broke
    # — an explicit permissions block leaves the Actions API at `none`, and the
    # alarm would file "not recorded yet" forever while README promises it names
    # the failing step. `contents: read` is what checkout needs.
    #
    # Narrowing the token does not break the REST probes in "Build snapshot":
    # those read *public* data in other repositories, which any valid
    # GITHUB_TOKEN may do — the permission block only scopes what the token can
    # touch in this repository.
    permissions:
      actions: read
      contents: read
      issues: write
    # Registry budgets can consume 50 minutes (Official 8 + Glama 30 +
    # Smithery 12); keep at least 40 minutes for install, focused tests,
    # enrichment, vacuum/gzip, preflight, and upload. Raising any budget below
    # eats into that reserve — re-add them here before touching this ceiling.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build core and test snapshot publication
        run: |
          pnpm --filter @mcpfinder/core build
          node scripts/test-snapshot-quality.mjs
          node scripts/test-snapshot-artifacts.mjs

      - name: Build snapshot
        run: node scripts/build-snapshot.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}
          # Manual-only escape hatch for an intentional corpus reset. It does
          # not bypass missing/error source status checks.
          MCPFINDER_SNAPSHOT_QUALITY_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_quality_regression && '1' || '0' }}
          # Glama has repeatedly needed more than the 12-minute local budget.
          # Thirty minutes leaves headroom inside the 90-minute job ceiling.
          MCPFINDER_GLAMA_SYNC_BUDGET_MINUTES: '30'
          # Smithery now restarts a stalled crawl across four attempts, and
          # four full passes do not fit the default 5-minute budget.
          # Twelve minutes covers them and still leaves the 90-minute ceiling
          # untouched next to Glama's 30.
          MCPFINDER_SMITHERY_SYNC_BUDGET_MINUTES: '12'
          # Local stdio keeps the 500 ms restart ladder because first-run live
          # sync is gated on the SDK's 60 s tool-call timeout. CI waits
          # 15 s / 30 s / 60 s so a registry mid-reindex can recover.
          MCPFINDER_CRAWL_RESTART_BASE_MS: '15000'
          # Glama requires an API key since 2026-08-26. An unset/empty secret
          # makes the Glama sync record a 'skipped' status, which fails the
          # quality gate — the previous complete snapshot keeps serving. Note
          # that Glama's API Data License requires visible Glama attribution
          # wherever this data is displayed.
          GLAMA_API_KEY: ${{ secrets.GLAMA_API_KEY }}
          # Powers the Smithery repo-probe and archived-repo enrichment. The
          # Actions-provided GITHUB_TOKEN is capped at ~1000 REST req/hr, so the
          # archived-repo pass is incremental: capped per run, with flags
          # carried across builds (see scripts/build-snapshot.mjs).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The gz digest is mandatory — it is the snapshot's identity. The brotli
      # digest is not: an absent or unusable block yields an empty `brsha`,
      # which skips the brotli upload and leaves the preflight to strip the
      # block before the manifest is published.
      - name: Read snapshot digests
        id: snapshot
        run: node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('dist/snapshot/manifest.json'));const hex=s=>typeof s==='string'&&/^[a-f0-9]{64}$/.test(s);if(!hex(m.sha256))throw new Error('invalid snapshot sha256');const br=m.brotli&&hex(m.brotli.sha256)&&m.brotli.sha256!==m.sha256?m.brotli.sha256:'';if(m.brotli&&!br)console.log('::warning::manifest brotli block is unusable; publishing gzip only');fs.appendFileSync(process.env.GITHUB_OUTPUT,'sha='+m.sha256+'\nbrsha='+br+'\n')"

      # Atomic handoff: upload the immutable database first. Only after it is
      # durable do we replace manifest.json, which is the publication pointer.
      - name: Upload immutable database to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put \
            mcp-finder-db-snapshots/snapshots/${{ steps.snapshot.outputs.sha }}.sqlite.gz \
            --file=dist/snapshot/data.sqlite.gz \
            --content-type=application/octet-stream \
            --remote

      # The brotli artifact is content-addressed by its own digest and has no
      # durable mutable twin: clients that cannot fetch it fall back to the gz
      # object, so a second mutable key would add a divergence risk and no
      # availability. Uploaded before the manifest announces it.
      #
      # Best-effort on purpose (continue-on-error): by this point the gz object
      # is durable and publishable, and brotli only ever saves bandwidth. A
      # failure here leaves the object missing, the preflight below then fails
      # to fetch it and strips the `brotli` block from the manifest, so the
      # published pointer never advertises an artifact that is not in R2.
      - name: Upload immutable brotli database to R2
        id: brotli-upload
        if: steps.snapshot.outputs.brsha != ''
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put \
            mcp-finder-db-snapshots/snapshots/${{ steps.snapshot.outputs.brsha }}.sqlite.br \
            --file=dist/snapshot/data.sqlite.br \
            --content-type=application/octet-stream \
            --remote

      # Verifies the gz artifact end to end through the public Worker — fatal,
      # it is the snapshot itself — and then the brotli artifact, which is not:
      # any brotli failure only drops the `brotli` block from the manifest on
      # disk and warns, loudly, in the log and the job summary.
      #
      # This is why the Worker deploy order does not matter: until the Worker
      # serves /api/v1/snapshot/data.sqlite.br, this step 404s on brotli, drops
      # the block, and publishes a gz-only manifest exactly like before. Deploy
      # the Worker whenever convenient; builds in between degrade, never fail.
      - name: Verify immutable database through public endpoint
        run: node scripts/verify-snapshot-upload.mjs dist/snapshot/manifest.json

      # `id` so the freeze signal below can tell "nothing was published" from
      # "the pointer moved and a later step failed" — two very different things
      # to wake someone up about.
      - name: Publish manifest pointer to R2
        id: manifest-pointer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put \
            mcp-finder-db-snapshots/manifest.json \
            --file=dist/snapshot/manifest.json \
            --content-type=application/json \
            --remote

      # Refresh only after the immutable object is verified and the manifest
      # pointer is live. This non-expiring copy keeps the current SHA available
      # after its 30-day immutable history object ages out.
      - name: Update durable current fallback in R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put \
            mcp-finder-db-snapshots/data.sqlite.gz \
            --file=dist/snapshot/data.sqlite.gz \
            --content-type=application/octet-stream \
            --remote

      # Commit the durable fallback only after both its manifest and bytes are
      # live. The Worker requires this proof before serving the mutable key.
      - name: Publish durable current commit marker in R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object put \
            mcp-finder-db-snapshots/data.sqlite.gz.sha256 \
            --file=dist/snapshot/data.sqlite.gz.sha256 \
            --content-type=text/plain \
            --remote

      - name: Summary
        run: |
          if [ -z '${{ steps.snapshot.outputs.brsha }}' ] || [ '${{ steps.brotli-upload.outcome }}' != 'success' ]; then
            echo '> [!WARNING]' >> $GITHUB_STEP_SUMMARY
            echo '> Published **without the brotli artifact** (compression or upload failed). Clients fall back to gzip; investigate before this becomes permanent.' >> $GITHUB_STEP_SUMMARY
          fi
          echo '### Snapshot manifest' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat dist/snapshot/manifest.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # ─── Freeze signalling ──────────────────────────────────────────────────
      #
      # A build that cannot finish leaves the previous complete snapshot in
      # place — correct, and deliberate — but nothing used to say so out loud.
      # A red run is visible only to whoever opens the Actions tab, and
      # `publishedAt` is a pull-based signal nobody polls; that is how issue #8
      # stayed unnoticed for six days.
      #
      # This is one of two signals. The step still runs on a failed or
      # cancelled run whose pointer did not move, so it can name the failing
      # step — but raise-unless-fresh refuses to file when the public manifest
      # is still fresh under the same 18-hour criterion the staleness monitor
      # uses. A single failed 6-hourly cycle is therefore a red X, not an
      # issue; the 18-hour monitor is what files when publishedAt actually
      # stalls. The build signal still raises when the probe says
      # stale/unreadable (a stall already in progress) or when the probe
      # itself throws. It is structurally blind to a run that never started
      # (GitHub disables cron schedules in a repository idle for 60 days) and
      # to a green run whose bytes never reached R2 — for those,
      # .github/workflows/snapshot-staleness.yml watches the published manifest
      # from the outside. Neither signal subsumes the other; hence both.
      #
      # Deduplication is by the `snapshot-freeze` label, not by title: the
      # label survives someone renaming the issue, and it is the same handle
      # the staleness monitor files under, so the two signals converge on one
      # thread instead of opening two parallel ones.
      - name: Signal frozen publication
        # `failure()` on its own is false when the job is *cancelled*, and a job
        # that trips `timeout-minutes: 90`, loses its runner, or is stopped by
        # hand is cancelled rather than failed — precisely the runs that publish
        # nothing. Hence `cancelled()` as well. One honest limit remains: after a
        # cancellation the runner gives post-cancellation steps only a short
        # grace window, and a runner that died outright runs nothing at all, so
        # this step can be killed before `gh` returns. That gap is not closed
        # here; it is what snapshot-staleness.yml, which needs no live runner,
        # exists to cover. The step's `gh run view` is one cheap API call to
        # name the failing step; raise-unless-fresh then probes the public
        # manifest before any issue create/comment. The default 4 × 15 s
        # staleness ladder (~66 s) does not fit that grace window, so the CLI
        # uses a short probe (2 attempts × 5 s + 500 ms backoff).
        # That bound is load-bearing for `cancelled()`.
        #
        # The pointer clause is the other half of being honest. Once
        # `Publish manifest pointer to R2` has succeeded, `publishedAt` has
        # already advanced and clients are bootstrapping the new snapshot, so
        # nothing about that run is frozen — the step below handles it instead.
        if: (failure() || cancelled()) && steps.manifest-pointer.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # '', 'failure' or 'skipped' here — 'success' is routed to the step
          # below, and the distinction is the difference between a stalled
          # publication and a stumble after one.
          POINTER: ${{ steps.manifest-pointer.outcome }}
        run: |
          set -euo pipefail
          failed=$(gh run view "$RUN_ID" --json jobs \
            --jq '[.jobs[].steps[] | select(.conclusion == "failure") | .name] | join(", ")' || true)
          [ -n "$failed" ] || failed='not recorded yet — see the run log'
          # The failing step names are the signature's stable half: a build that
          # keeps dying in the same place says nothing new, while one that moves
          # to a different step is a different incident and must break through
          # the shared script's 12-hour throttle.
          export FREEZE_SIGNATURE="build:pointer=${POINTER:-none}:$failed"
          export FREEZE_BODY=$(cat <<EOF
          The scheduled snapshot build did not finish, so **no new snapshot was published**.

          - failing step(s): $failed
          - manifest pointer this run: \`${POINTER:-not reached}\`
          - run: $RUN_URL

          The previous complete snapshot is **still being served**: clients keep
          bootstrapping normally and nothing 404s. This is not an availability
          incident, it is a data stall — \`publishedAt\` stops advancing until a
          build succeeds again. The next successful build closes this issue.
          EOF
          )
          node scripts/snapshot-freeze-signal.mjs raise-unless-fresh

      # A failure *after* the pointer moved is not a freeze at all: `publishedAt`
      # advanced, and everyone bootstrapping from now on gets the new snapshot.
      # What broke is the durable fallback, its commit marker or the run summary
      # — real enough to leave the run red, but filing it under `snapshot-freeze`
      # would make the label assert the opposite of what the published manifest
      # says, and a label that lies is worse than no label.
      #
      # So this path opens nothing, and goes one step further: it *clears* an
      # open freeze thread. The whole signal rests on one criterion — the age of
      # `publishedAt` — and by that criterion publication is healthy again. The
      # staleness monitor would reach the same conclusion from the outside
      # within two hours anyway; leaving the issue open until then would only
      # have the two signals disagree about a manifest they both call fresh.
      # The post-publication failure is carried by the red run and the summary
      # below, which is where a broken *upload* belongs.
      - name: Report failure after publication
        if: (failure() || cancelled()) && steps.manifest-pointer.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          failed=$(gh run view "$RUN_ID" --json jobs \
            --jq '[.jobs[].steps[] | select(.conclusion == "failure") | .name] | join(", ")' || true)
          [ -n "$failed" ] || failed='not recorded yet — see the run log'
          {
            echo '> [!WARNING]'
            echo "> **The snapshot was published**, then this run failed at: $failed."
            echo '> The manifest pointer is live and `publishedAt` advanced, so publication is *not* frozen and no freeze issue is filed. What may be out of date is the durable fallback (`data.sqlite.gz`) or its commit marker — the Worker keeps serving the immutable object either way.'
          } >> "$GITHUB_STEP_SUMMARY"
          export FREEZE_BODY="Publication is not frozen: the manifest pointer moved in $RUN_URL before that run failed at: $failed. Closing on the criterion this alarm is built from — \`publishedAt\` advanced. The post-publication failure is tracked by the red run, not here."
          node scripts/snapshot-freeze-signal.mjs clear

      # The all-clear. Without it the freeze issue would need a human to close
      # it, and an alarm nobody closes is an alarm everyone learns to ignore.
      # `success()` is the default condition, spelled out here because this
      # step's meaning depends on it entirely.
      - name: Clear frozen-publication signal
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          published=$(node -e "process.stdout.write(String(JSON.parse(require('node:fs').readFileSync('dist/snapshot/manifest.json')).publishedAt ?? 'unknown'))")
          export FREEZE_BODY="Publication resumed: a snapshot was published at \`$published\` by $RUN_URL."
          node scripts/snapshot-freeze-signal.mjs clear
